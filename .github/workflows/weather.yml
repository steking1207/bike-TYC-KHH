# 新增騎乘紀錄後，自動抓那天的歷史天氣格點（data/weather/<日期>.json），給地圖的風力／降雨圖層用
name: 抓歷史天氣

on:
  push:
    branches: [main, 'claude/**']
    paths: [data/rides.json, tools/fetch_weather.py, .github/workflows/weather.yml]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'  # 每週一補抓（剛騎完的日期，再分析資料要幾天後才齊）

permissions:
  contents: write

concurrency:
  group: weather-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/fetch_weather.py
      - name: Commit
        run: |
          git add data/weather
          if git diff --cached --quiet; then echo "沒有新資料"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git commit -m "抓歷史天氣：$(git diff --cached --name-only | xargs -n1 basename | sed 's/.json//' | paste -sd ' ')"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
